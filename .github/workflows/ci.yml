name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 24, cache: npm }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - name: Safety copy lint (no detox / cleanse / cure claims in UI copy)
        run: "! grep -rniE '\\b(detox|cleanse|flush toxins|cures?|reverses?)\\b' app components --include=*.tsx | grep -v 'no detox' "
      - run: npm run build
        env: { DATABASE_URL: "" }
      - run: npm audit --omit=dev --audit-level=high || true
